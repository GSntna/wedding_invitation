<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karla & Gus - Save the Date</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Parisienne&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 1s ease-out forwards;
        }
    </style>
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Gus y Karla - Save the date!" />
    <meta property="og:description" content="¡Nos casamos! Guarda la fecha" />
    <meta property="og:image" content="https://gusykay.gustats.com/closed-envelope.jpg" />
    <meta property="og:url" content="https://gusykay.gustats.com" />
    <meta property="og:type" content="website" />

    <!-- Optional: Defines the image size -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card (optional but recommended) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gus y Karla - Save the date!" />
    <meta name="twitter:image" content="https://gusykay.gustats.com/closed-envelope.jpg" />
</head>
<body class="min-h-screen flex flex-col justify-between" style="background-color: #f2ece0; background-image: url('background.png'); background-size: contain; background-position: center; background-repeat: repeat; background-attachment: fixed;">
    <div class="text-center px-4 pt-24 md:pt-24">
        <p class="text-lg md:text-xl text-black tracking-widest uppercase font-bold" style="font-family: Cinzel;text-shadow: -0.5px -0.5px 0 #f2ece0, 0.5px -0.5px 0 #f2ece0, -0.5px 0.5px 0 #f2ece0, 0.5px 0.5px 0 #f2ece0;">Karla & Gus</p>
    </div>
    
    <div class="flex-grow flex flex-col items-center justify-center px-4 py-8">
        <div class="w-full max-w-2xl fade-in">
            <!-- Opened Envelope Image -->
            <div class="mb-0">
                <img src="opened-envelope.svg" alt="Opened Envelope" class="w-full h-auto">
            </div>
            
    <div class="text-center px-4 pb-8 md:pb-16">
        <p class="text-sm md:text-xl text-black tracking-wider font-bold" style="font-family: 'PT Serif';text-shadow: -0.5px -0.5px 0 #f2ece0, 0.5px -0.5px 0 #f2ece0, -0.5px 0.5px 0 #f2ece0, 0.5px 0.5px 0 #f2ece0;">¡Los esperamos!</p>
        <p class="text-sm md:text-xl text-black tracking-wider font-bold" style="font-family: 'PT Serif';text-shadow: -0.5px -0.5px 0 #f2ece0, 0.5px -0.5px 0 #f2ece0, -0.5px 0.5px 0 #f2ece0, 0.5px 0.5px 0 #f2ece0;">PS: El lunes 16 es puente</p>
    </div>
        <!-- Extra space to extend background beyond viewport -->
    <div style="height: 50vh;"></div>
</body>
</html>
